name: Update activity graph

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: AbdulWajid768
          options: theme=react&hide_border=true&bg_color=0d1117&color=61DAFB&line=764ABC&point=00d4aa&area=true&height=260
          output_path: assets/github-activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-graph.svg
          git diff --staged --quiet && echo "Graph unchanged" && exit 0
          git commit -m "chore(docs): refresh GitHub activity graph"
          git push
